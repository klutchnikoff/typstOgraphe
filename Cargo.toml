[workspace]
members = ["crates/core", "crates/i18n", "crates/app", "crates/cli", "crates/mcp", "app/src-tauri"]
default-members = ["app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
typstographe-mcp = { path = "crates/mcp" }
typstographe-core = { path = "crates/core" }
typstographe-i18n = { path = "crates/i18n" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
resvg = { version = "=0.47.0", default-features = false }
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
thiserror = "2"
base64 = "0.22"
typst = "=0.15.1"
typst-eval = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-render = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
comemo = "0.5"
png = "0.18"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
rfd = "0.15"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
atomic-write-file = "0.3.1"
home = "0.5.12"
time = { version = "0.3", features = ["formatting"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.13.1"
spellbook = "0.4.2"
unicode-normalization = "0.1"
muda = { version = "0.21", default-features = false }
fluent-syntax = "0.12"
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive", "string"] }
assert_cmd = "2.2.2"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync"] }
interprocess = { version = "=2.4.7", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Keep preview rendering fast in development as well as release.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.typst-render]
opt-level = 3
