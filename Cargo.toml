[package]
name = "typstographe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Prototype d’édition visuelle de courriers avec egui et Typst"
publish = false

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-render = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
comemo = "0.5"
png = "0.18"

[profile.dev]
debug = 0

[profile.test]
debug = 0
