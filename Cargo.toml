[package]
name = "typstographe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Édition visuelle de documents avec egui et Typst"
publish = false

[features]
editor-model-spike = []

[[example]]
name = "editor-model-spike"
path = "experiments/editor-model/main.rs"
required-features = ["editor-model-spike"]

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
resvg = { version = "=0.47.0", default-features = false }
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
thiserror = "2"
base64 = "0.22"
typst = "=0.15.1"
typst-eval = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-render = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
comemo = "0.5"
png = "0.18"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
rfd = "0.15"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
atomic-write-file = "0.3.1"
time = { version = "0.3", features = ["formatting"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.13.1"
spellbook = "0.4.2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
fluent-syntax = "0.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
