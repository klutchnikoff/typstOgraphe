[package]
name = "typstographe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Prototype d’édition visuelle de courriers avec egui et Typst"
publish = false

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-render = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
comemo = "0.5"
png = "0.18"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
rfd = "0.15"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies]
fluent-syntax = "0.12"

[profile.dev]
debug = 0

[profile.test]
debug = 0
