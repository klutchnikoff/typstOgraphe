[package]
name = "typstographe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Éditeur visuel typstOgraphe avec Tauri et Typst"

[lints]
workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
typstographe-mcp = { workspace = true }
uuid = { version = "1", features = ["v4"] }
typstographe-core = { workspace = true }
typstographe-i18n = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.60.1", default-features = false }
base64 = "0.22"
atomic-write-file = "0.3.1"
sha2 = "0.11.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
png = "0.18"

[dev-dependencies]
tempfile = "3"
