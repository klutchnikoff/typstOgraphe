[package]
name = "typstographe-web-editor-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
uuid = { version = "1", features = ["v4"] }
typstographe-core = { path = "../../../crates/core" }
typstographe-i18n = { path = "../../../crates/i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.60.1", default-features = false }
base64 = "0.22"
atomic-write-file = "0.3.1"
sha2 = "0.11.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
png = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

# Filtering millions of pixels must stay fast even in a debug application.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.test]
debug = 0
