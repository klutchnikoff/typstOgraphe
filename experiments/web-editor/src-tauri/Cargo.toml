[package]
name = "typstographe-web-editor-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
typstographe-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
atomic-write-file = "0.3.1"
sha2 = "0.11.1"
typst-render = "=0.15.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
