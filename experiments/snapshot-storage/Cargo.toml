[package]
name = "typstographe-snapshot-storage-evaluation"
version = "0.0.0"
edition = "2024"
publish = false

# Isolated experiment: no Git dependency is added to the application.
[workspace]

[dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
atomic-write-file = "0.3.1"

[profile.release]
debug = false
strip = true
