[package]
name = "typstographe-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Adaptateur MCP partagé et rattachement local pour typstOgraphe"

[lints]
workspace = true

[dependencies]
typstographe-core.workspace = true
typstographe-i18n.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "io-std", "time"] }
schemars.workspace = true
base64.workspace = true
home.workspace = true
jsonschema = { version = "=0.60.1", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
rmcp = { workspace = true, features = ["client"] }
jsonschema = { version = "=0.60.1", default-features = false }
