name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo +stable fmt --all --check
      - name: Architecture guards
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          scripts/check-file-length.sh --warn
          scripts/check-file-length.sh --root crates/core/src/engine
          scripts/check-file-length.sh --root crates/core/src/document
      - name: Core dependency boundary
        run: |
          python scripts/check_core_dependencies.py
          cargo +stable check --locked -p typstographe-core
      - name: Workspace tests and interface contract examples
        run: cargo +stable test --locked --workspace --exclude typstographe
      - run: cargo +stable clippy --locked --workspace --exclude typstographe --all-targets -- -D warnings
      - name: Informative WASM compatibility check
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          rustup target add wasm32-unknown-unknown
          cargo +stable check --locked -p typstographe-core --target wasm32-unknown-unknown
