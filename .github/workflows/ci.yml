name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev
          libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo +stable fmt --check
      - name: Architecture guards
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          scripts/check-file-length.sh --warn
          scripts/check-file-length.sh --root src/app
      - name: Editor model experiment
        if: runner.os == 'Linux'
        run: cargo +stable test --locked --features editor-model-spike --example editor-model-spike model_spike
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
