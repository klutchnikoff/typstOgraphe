name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/ci_plan.py --base "$CI_BASE_SHA"
  verify:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/routine.yml
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    with:
      level: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      rust: ${{ needs.scope.outputs.rust == 'true' }}
  result:
    name: Résultat
    needs: [scope, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          test "$SCOPE" = success
          test "$VERIFY" = success || test "$VERIFY" = skipped
