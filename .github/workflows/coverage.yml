name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT" = workflow_dispatch ]; then
            python3 .github/scripts/ci_plan.py --force
          else
            python3 .github/scripts/ci_plan.py --base "$CI_BASE_SHA"
          fi
  measure:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:web
      # Unit tests of the web editor; graphical recipes are not measured.
      - name: Web unit test coverage
        run: npm run test:coverage
      # Nightly is used only here to exclude test implementations via coverage(off).
      # The application and the three-platform CI continue to use stable Rust.
      - name: Coverage toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-linux-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-linux-nightly-
      # --no-report preserves old artifacts. A restored target cache must not
      # contribute binaries/profiles from previous revisions to this report.
      - name: Clean previous workspace coverage
        run: cargo +nightly llvm-cov clean --workspace
      - name: Run instrumented tests
        run: cargo +nightly llvm-cov --locked --workspace --no-report
      - name: Generate reports
        run: |
          mkdir -p output/coverage
          cargo +nightly llvm-cov report --workspace --html --output-dir output/coverage
          cargo +nightly llvm-cov report --workspace --lcov --output-path output/coverage/lcov.info
          cargo +nightly llvm-cov report --workspace --json --summary-only --output-path output/coverage/summary.json
          python3 .github/scripts/coverage_summary.py output/coverage/summary.json output/coverage/badge
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            output/coverage/
            output/coverage-web/
          if-no-files-found: error
          retention-days: 30

  # Only a successful main-branch run can update the public badge.
  # This isolated job executes no repository code with write permissions.
  badge:
    needs: measure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage-report
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: coverage
          publish_dir: coverage-report/coverage/badge
          enable_jekyll: true
          commit_message: Update coverage badge
