name: Application Tauri
on:
  push:
    paths: ['app/**', 'assets/**', 'crates/core/**', 'crates/i18n/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app/**', 'assets/**', 'crates/core/**', 'crates/i18n/**', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux Tauri libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - run: npm ci
      - run: npm run check:format
      - run: npm test
      - run: npm run build:web
      - run: cargo +stable fmt --all --check
      - run: cargo +stable test --locked -p typstographe
      - run: cargo +stable clippy --locked -p typstographe --all-targets -- -D warnings
      - name: Browser recipe driver
        if: runner.os == 'Linux'
        run: cargo +stable build --locked -p typstographe
      - name: Browser engines
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium webkit
      - name: Graphical recipes
        if: runner.os == 'Linux'
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: desktop-browser-results
          path: app/test-results
