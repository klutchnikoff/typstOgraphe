# Shared verification steps: no independent push/PR trigger and no duplicate run.
name: Vérifications communes
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true
      browsers:
        type: string
        default: none
      audit:
        type: boolean
        default: false
      wasm:
        type: boolean
        default: false
      native_conservation:
        type: boolean
        default: false
      acceptance_only:
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux Tauri libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            checks-${{ runner.os }}-
            desktop-${{ runner.os }}-
            rust-${{ runner.os }}-
      - run: npm ci
      - name: Formats and architecture
        if: runner.os == 'Linux' && !inputs.acceptance_only
        run: |
          npm run check:format
          cargo +stable fmt --all --check
          python3 -m unittest discover -s scripts/tests -v
          scripts/check-file-length.sh
          python3 scripts/check_core_dependencies.py
      - name: Web unit tests and native locales
        if: runner.os == 'Linux' && !inputs.acceptance_only
        run: npm test
      # Each native build embeds this frontend. Pure web tests run only on Linux.
      - run: npm run build:web
      - name: Workspace tests, including recovery and file conservation
        if: '!inputs.acceptance_only'
        run: cargo +stable test --locked --workspace --features typstographe/recipe-driver
      - name: Clippy, distributed and recipe builds
        if: '!inputs.acceptance_only'
        run: |
          cargo +stable clippy --locked --workspace --all-targets -- -D warnings
          cargo +stable clippy --locked -p typstographe --all-targets --features recipe-driver -- -D warnings
      - name: Functional recipe driver
        if: '!inputs.native_conservation'
        run: cargo +stable build --locked -p typstographe --features recipe-driver
      - name: Native acceptance executables, with one shared dependency graph
        if: inputs.native_conservation
        run: cargo +stable build --locked -p typstographe -p typstographe-cli --features typstographe/recipe-driver
      - name: Yjs and Yrs shared contract recipes
        if: '!inputs.acceptance_only'
        run: npm run test:contract --workspace @typstographe/app
      - name: Embedded native locales for standalone Cargo launches
        if: runner.os == 'macOS'
        run: |
          node --test app/scripts/native-locales.test.mjs
          node app/scripts/check-native-locales.mjs target/debug/typstographe
      - name: Targeted storage and recovery guards
        if: inputs.native_conservation && inputs.acceptance_only
        run: |
          cargo +stable test --locked -p typstographe --features recipe-driver files::persistence_tests
          cargo +stable test --locked -p typstographe --features recipe-driver recovery::
      - name: Virtual native display on Linux
        if: runner.os == 'Linux' && inputs.native_conservation
        run: sudo apt-get install -y xvfb dbus-x11
      - name: Native recovery and publication acceptance
        if: inputs.native_conservation
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- npm run test:draft-conservation-native -- "$GITHUB_WORKSPACE/output/a3-native-conservation"
            xvfb-run -a dbus-run-session -- npm run test:publication-native -- "$GITHUB_WORKSPACE/output/a3-native-publication"
          else
            npm run test:draft-conservation-native -- "$GITHUB_WORKSPACE/output/a3-native-conservation"
            npm run test:publication-native -- "$GITHUB_WORKSPACE/output/a3-native-publication"
          fi
      - name: Retain native acceptance results, including failures
        uses: actions/upload-artifact@v7
        if: always() && inputs.native_conservation
        with:
          name: a3-acceptance-${{ runner.os }}
          path: |
            output/a3-native-*/**/report.json
            output/a3-native-*/**/native-*-report.json
            output/a3-native-*/**/*.log
          if-no-files-found: error
          retention-days: 7
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux' && inputs.audit && !inputs.acceptance_only
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency advisories, licences and sources
        if: runner.os == 'Linux' && inputs.audit && !inputs.acceptance_only
        run: |
          cargo deny --locked check
          npm audit --audit-level=moderate
      - name: Core WebAssembly compatibility
        if: runner.os == 'Linux' && inputs.wasm && !inputs.acceptance_only
        run: |
          rustup target add wasm32-unknown-unknown
          cargo +stable check --locked -p typstographe-core --target wasm32-unknown-unknown
      - name: Browser engines
        if: runner.os == 'Linux' && inputs.browsers != 'none' && !inputs.acceptance_only
        run: npx playwright install --with-deps chromium webkit
      - name: Critical graphical recipes
        if: runner.os == 'Linux' && inputs.browsers == 'smoke' && !inputs.acceptance_only
        run: npm run test:browser:smoke
      - name: Exhaustive graphical recipes
        if: runner.os == 'Linux' && inputs.browsers == 'full' && !inputs.acceptance_only
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Linux' && inputs.browsers != 'none'
        with:
          name: browser-results-${{ inputs.browsers }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
