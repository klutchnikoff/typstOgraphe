name: Validation complète
on:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      packages:
        description: Construire les installateurs de test ; sur un tag, préparer une release en brouillon
        type: boolean
        default: false
      acceptance_only:
        description: Exécuter uniquement les recettes natives du socle sur les trois systèmes
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: exhaustive-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name || 'requested' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      build_packages: ${{ steps.release.outputs.build_packages }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check release version and checked-out tag
        id: release
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_ACCEPTANCE_ONLY: ${{ inputs.acceptance_only }}
        run: node .github/scripts/release-plan.mjs
      - name: Refuse moved tags and already published releases
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node .github/scripts/release-publish.mjs check
      - id: plan
        run: python3 .github/scripts/ci_plan.py --force
  verify:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      platforms: '["ubuntu-latest","macos-latest","windows-latest"]'
      browsers: full
      audit: true
      wasm: true
      native_conservation: true
      acceptance_only: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_only }}
  packages:
    needs: [scope, verify]
    if: needs.scope.outputs.build_packages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      # The DMG bundler reads CI itself; --ci alone does not skip Finder.
      CI: 'true'
      RUSTUP_TOOLCHAIN: stable
      INSTALLER_PLATFORM: ${{ matrix.id }}
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
      RELEASE_COMMIT: ${{ needs.scope.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux Tauri libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain and explicit architectures
        env:
          RUST_TARGETS: ${{ matrix.rustTargets }}
        run: |
          rustup toolchain install stable --profile minimal
          for target in $RUST_TARGETS; do rustup target add "$target"; done
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: packages-${{ matrix.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            packages-${{ matrix.id }}-
            packages-${{ runner.os }}-
            checks-${{ runner.os }}-
      - run: npm ci
      - name: Remove stale bundles, retaining compiled dependencies
        run: node .github/scripts/release-assets.mjs clean
      - name: Build a distributed binary without the recipe driver
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: npm run tauri -- build --ci --no-sign --target "$TARGET" --bundles "$BUNDLES" --config '{"bundle":{"active":true,"createUpdaterArtifacts":false}}' -- --locked
      - run: npm run check:distribution
      - name: Inspect native installers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            Linux)
              for file in "$bundle"/deb/*.deb; do
                dpkg-deb --info "$file"
                dpkg-deb --contents "$file" > /tmp/typstographe-package-contents
                grep 'usr/bin/typstographe' /tmp/typstographe-package-contents
                grep 'usr/share/mime/packages/typstographe.xml' /tmp/typstographe-package-contents
                grep 'mimetypes/application-x-typstographe.svg' /tmp/typstographe-package-contents
                dpkg-deb --fsys-tarfile "$file" | tar -xOf - --wildcards './usr/share/applications/*.desktop' | grep -E '^Exec=.* %f$'
              done
              for file in "$bundle"/appimage/*.AppImage; do
                work=$(mktemp -d)
                (cd "$work" && "$GITHUB_WORKSPACE/$file" --appimage-extract > /dev/null)
                test -x "$work/squashfs-root/AppRun"
                test -x "$work/squashfs-root/usr/bin/typstographe"
                test -s "$work/squashfs-root/usr/share/mime/packages/typstographe.xml"
                test -s "$work/squashfs-root/usr/share/icons/hicolor/scalable/mimetypes/application-x-typstographe.svg"
                rm -rf "$work"
              done
              ;;
            macOS)
              app="$bundle/macos/typstOgraphe.app"
              test -x "$app/Contents/MacOS/typstographe"
              plutil -lint "$app/Contents/Info.plist"
              test -s "$app/Contents/Resources/document.icns"
              test "$(plutil -extract CFBundleDocumentTypes.0.CFBundleTypeIconFile raw -o - "$app/Contents/Info.plist")" = document.icns
              test "$(plutil -extract UTExportedTypeDeclarations.0.UTTypeIdentifier raw -o - "$app/Contents/Info.plist")" = org.typstographe.project
              lipo -verify_arch x86_64 arm64 "$app/Contents/MacOS/typstographe"
              for file in "$bundle"/dmg/*.dmg; do hdiutil verify "$file"; done
              ;;
            Windows)
              for file in "$bundle"/nsis/*.exe; do test -s "$file"; done
              ;;
          esac
      - name: Collect exact-version installers and provenance
        run: node .github/scripts/release-assets.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: output/packages/${{ matrix.id }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  draft-release:
    needs: [scope, packages]
    if: needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Builders only read the repository; this is the single asset-writing job.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.scope.outputs.tag }}
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
      RELEASE_COMMIT: ${{ needs.scope.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: output/downloads
      - name: Verify all installers and create or complete the draft
        run: node .github/scripts/release-publish.mjs publish
